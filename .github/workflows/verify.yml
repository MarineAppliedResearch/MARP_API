# CI for marp-api.
#
# Two jobs. `checks` is fast and needs nothing: generated documentation matching the
# routes, the application suites, and the harness. `api` stands up a real PostgreSQL,
# builds this repository's schema the way a developer would, and runs the whole Jest
# suite against it.
#
# That second job was not possible until 2026-09-05. The suite runs against a real
# database rather than mocks, and one block of it silently depended on the development
# server's own contents -- it seeded nothing, and asserted the absence of a row that
# only existed there, so on an empty database one check failed and three passed
# vacuously. With that block seeding its own entry, the suite is 227 for 227 on a
# database built from nothing, which is what makes this job worth having.
#
# The schema is built exactly as `marp db up` and a developer build it: the baseline
# first, because the migrations cannot create observations, projects, sessions or
# metaInfos, then the migrations on top.

name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: marp-api
          fetch-depth: 0        # the OpenAPI diff below needs the merge base

      # The harness checks live in the umbrella, which is public. Checking it out is
      # cheaper than vendoring four copies of the same script and keeping them in step.
      - uses: actions/checkout@v4
        with:
          repository: MarineAppliedResearch/MARP
          path: MARP

      - uses: actions/setup-node@v4
        with:
          node-version-file: marp-api/.nvmrc
          cache: npm
          cache-dependency-path: marp-api/package-lock.json

      - name: Install
        working-directory: marp-api
        run: npm ci

      # The frontend applications carry their own suites, and they run against fixtures
      # rather than the API -- which is exactly why they can be verified here when the
      # main suite cannot.
      - name: Application unit tests
        working-directory: marp-api
        run: npm run test:app:mosaic-review:unit

      # `docs/openapi.generated.json` and `docs/developer/` are committed, so a route change
      # without `npm run docs:build` makes the diff a lie. This is that rule as a check.
      - name: Generated documentation is current
        working-directory: marp-api
        run: |
          npm run docs:api:build
          if ! git diff --quiet -- docs/openapi.generated.json; then
            echo "::error::docs/openapi.generated.json is out of date. Run: npm run docs:build"
            git diff --stat -- docs/openapi.generated.json
            exit 1
          fi
          echo "Generated OpenAPI matches the routes."

      # Advisory, not a gate. A removed path or a newly required field is a breaking change
      # for the annotation GUI, which lives in a repository this one cannot see and which
      # nothing else detects. Surfacing it in the PR is the whole point.
      - name: Report OpenAPI changes against the base
        if: github.event_name == 'pull_request'
        working-directory: marp-api
        continue-on-error: true
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}" || exit 0
          if git diff --quiet "$base" -- docs/openapi.generated.json; then
            echo "No API surface change."
            exit 0
          fi
          echo "::warning::The API surface changed. Removals and newly required fields are"
          echo "::warning::breaking for VIDEO_PROCESSING_GUI. Note them in .marp/task.md."
          git diff "$base" -- docs/openapi.generated.json | head -200

      # Explicit path: only this component is checked out here, so the registry would
      # find nothing to scan.
      # The umbrella is checked out at its default branch. Until the harness is merged
      # there, this directory does not exist -- so say that, rather than letting Node
      # report a missing module and leaving somebody to work out why.
      - name: The harness is available
        run: |
          if [ ! -d MARP/scripts/harness ]; then
            echo "::error::MARP's default branch has no scripts/harness/ yet."
            echo "::error::Merge the harness into the MARP umbrella first, then this repository."
            exit 1
          fi
          echo "Harness found."

      - name: Instruction files carry no credential or stale environment fact
        run: node MARP/scripts/harness/doc-check.mjs marp-api

      - name: Shared instruction block matches the umbrella
        run: node MARP/scripts/harness/shared-check.mjs marp-api

      - name: Task specification gate
        working-directory: marp-api
        run: node ../MARP/scripts/harness/spec-check.mjs .

  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marp_user
          POSTGRES_PASSWORD: marp_ci_password
          POSTGRES_DB: mare_v1
        ports: ['5432:5432']
        # Without this the first migration races the server's own startup and fails
        # with a connection error that reads like a configuration mistake.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: mare_v1
      DB_USER: marp_user
      DB_PASSWORD: marp_ci_password
      DB_DIALECT: postgres
      # The API refuses to start in production without one and warns in development.
      # A CI value keeps the log honest; it authenticates nothing that outlives the job.
      AUTH_SESSION_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The migrations cannot build a database on their own: observations, projects,
      # sessions and metaInfos predate the migration history and every migration that
      # touches them assumes they exist. db/baseline/schema.sql is that starting point.
      - name: Build the schema from the baseline
        run: node scripts/init-database.js

      - name: Apply the migrations
        run: npx sequelize-cli db:migrate

      - name: Migration ledger
        run: npx sequelize-cli db:migrate:status

      # --runInBand, because the suite writes to a real database and parallel workers
      # race each other over it. See jest.config.js.
      - name: API test suite
        run: npm test
