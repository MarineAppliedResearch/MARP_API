<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard Chart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header with image and text -->
        <header class="text-center py-4">
            <img src="https://maregroup.org//wp-content/uploads/2020/04/mare-logo-nobackground-2.gif" alt="Dashboard Logo" class="img-fluid mb-3">
            <h1 class="display-5">Video Processor User Dashboard</h1>
            <p class="lead">Track User Activity Over Time</p>
            <p class="text-muted">Use the date selectors below to view user observations within a specified time range.</p>
        </header>

        <!-- Date Range Inputs -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-2 text-center">
                <button id="backwardButton" class="btn btn-secondary mt-4">← Previous Week</button>
            </div>
            <div class="col-md-4 col-sm-6 mb-3">
                <label for="startDate" class="form-label">Start Date:</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col-md-4 col-sm-6 mb-3">
                <label for="endDate" class="form-label">End Date:</label>
                <input type="date" id="endDate" class="form-control">
            </div>
            <div class="col-md-2 text-center">
                <button id="forwardButton" class="btn btn-secondary mt-4">Next Week →</button>
            </div>
            <div class="col-md-2 text-center">
                <button id="fetchDataButton" class="btn btn-primary mt-4">Fetch Data</button>
            </div>
        </div>

        <!-- Chart Canvas -->
        <div class="row">
            <div class="col-12">
                <canvas id="userActivityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Helper function to generate a list of all dates between two dates
        function getAllDates(start, end) {
            const dates = [];
            let currentDate = new Date(start);

            while (currentDate <= new Date(end)) {
                dates.push(currentDate.toISOString().split('T')[0]); // Format YYYY-MM-DD
                currentDate.setDate(currentDate.getDate() + 1); // Increment by one day
            }
            return dates;
        }

        // Function to fetch data from the API and generate the chart
        async function getDashboardData(startDate, endDate) {
            try {
                // Make the API call with date range as query parameters
                const response = await fetch(`http://192.168.1.203:3081/api/dashboardData?start=${startDate}&end=${endDate}`);
                const dashboardData = await response.json();

                const ctx = document.getElementById('userActivityChart').getContext('2d');

                // Prepare arrays for labels (dates) and datasets
                let labels = getAllDates(startDate, endDate); // Generate all dates in range
                let userNames = new Set();  // Use Set to track unique user names
                let userObservationsData = {};

                // Define a color palette for users
                const colorPalette = [
                    'rgba(153, 102, 255, 0.2)', // User 1
                    'rgba(75, 192, 192, 0.2)',  // User 2
                    'rgba(255, 99, 132, 0.2)',  // User 3
                    'rgba(255, 159, 64, 0.2)',  // User 4
                    'rgba(54, 162, 235, 0.2)',  // User 5
                ];
                const borderColorPalette = [
                    'rgba(153, 102, 255, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(255, 99, 132, 1)',
                    'rgba(255, 159, 64, 1)',
                    'rgba(54, 162, 235, 1)',
                ];

                // Process the dashboard data
                Object.keys(dashboardData).forEach(userName => {
                    Object.keys(dashboardData[userName]).forEach(date => {
                        // Track user names for later
                        userNames.add(userName);

                        // Extract observations data for the date
                        const data = dashboardData[userName][date];

                        // Initialize user data if it doesn't exist
                        if (!userObservationsData[userName]) userObservationsData[userName] = {};

                        // Populate observation counts
                        userObservationsData[userName][date] = data.observations || 0;
                    });
                });

                // Prepare datasets for Chart.js
                let datasets = [];

                userNames.forEach((userName, index) => {
                    datasets.push({
                        label: `${userName} Observations`,
                        data: labels.map(date => userObservationsData[userName]?.[date] || 0), // Zero for missing dates
                        backgroundColor: colorPalette[index % colorPalette.length],
                        borderColor: borderColorPalette[index % borderColorPalette.length],
                        borderWidth: 1,
                        fill: false,
                    });
                });

                // Sort labels to ensure they're in order
                labels.sort();

                // Destroy existing chart instance if it exists (to avoid overlap)
                if (window.chart) {
                    window.chart.destroy();
                }

                // Create chart
                window.chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels, // Dates as labels
                        datasets: datasets
                    },
                    options: {
                        scales: {
                            x: {
                                type: 'category', // Use category instead of time
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Observation Count' // Y-axis title
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
            }
        }

        // Function to update the date range and fetch data
        function updateDateRange(weekChange) {
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');

            // Get current dates from inputs
            let startDate = new Date(startDateInput.value);
            let endDate = new Date(endDateInput.value);

            // Update dates based on weekChange
            startDate.setDate(startDate.getDate() + weekChange * 7);
            endDate.setDate(endDate.getDate() + weekChange * 7);

            // Update input values
            startDateInput.value = startDate.toISOString().split('T')[0];
            endDateInput.value = endDate.toISOString().split('T')[0];

            // Fetch data with the updated date range
            getDashboardData(startDateInput.value, endDateInput.value);
        }

        // Event listeners for the buttons
        document.getElementById('fetchDataButton').addEventListener('click', () => {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            // Validate that both dates are provided
            if (startDate && endDate) {
                getDashboardData(startDate, endDate);
            } else {
                alert('Please select both a start and end date.');
            }
        });

        // Event listeners for the navigation buttons
        document.getElementById('backwardButton').addEventListener('click', () => updateDateRange(-1));
        document.getElementById('forwardButton').addEventListener('click', () => updateDateRange(1));

        // On page load, set default dates
        window.onload = function () {
            const startDate = new Date();
            const today = new Date();
            const endDate = new Date();
            endDate.setDate(today.getDate() + 1);
            startDate.setDate(startDate.getDate() - 30); // One month ago
            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];

            // Fetch initial data
            getDashboardData(startDate.toISOString().split('T')[0], endDate.toISOString().split('T')[0]);
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
