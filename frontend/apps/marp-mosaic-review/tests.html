<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MARP Mosaic Review — requirement checks</title>
<link rel="stylesheet" href="../../shared/assets/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 26px 30px; background: var(--navy-1000); color: var(--text);
         font-family: var(--body-font); font-size: 13px; }
  h1 { margin: 0 0 4px; font-size: 17px; color: var(--white); font-weight: 600; }
  .lede { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; max-width: 70ch; line-height: 1.5; }
  .lede code { color: var(--cyan-300); }
  .summary { display: inline-block; padding: 8px 15px; border-radius: 6px; margin-bottom: 20px;
             font-size: 14px; border: 1px solid var(--border); }
  .summary.good { border-color: rgba(167,236,53,.5); color: var(--green-300); }
  .summary.bad  { border-color: rgba(224,97,107,.6); color: var(--red-400); }
  .summary b { color: var(--white); }
  section { margin-bottom: 18px; }
  h3 { margin: 0 0 7px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
       color: var(--cyan-300); font-weight: 600; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { display: flex; align-items: baseline; gap: 10px; padding: 5px 0;
       border-bottom: 1px solid var(--line); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  li.pass .dot { background: var(--green-400); }
  li.fail .dot { background: var(--red-400); }
  li.skip .dot { background: var(--grey-400); }
  li.fail .nm { color: #f0b6bb; }
  .note { color: var(--faint); font-size: 11.5px; }
  li.fail .note { color: var(--red-400); }
  #mount:empty::after { content: "running…"; color: var(--faint); }
</style>
</head>
<body>
  <h1>Requirement checks</h1>
  <p class="lede">
    Each check names the requirement from <a href="https://github.com/MarineAppliedResearch/MARP_API/issues/68"
    style="color:var(--cyan-300)">MARP_API#68</a> that it holds the prototype to. They drive the same
    named actions the interface drives, so they test behaviour rather than markup.
    Served over HTTP — <code>python -m http.server</code> from <code>frontend/</code>.
  </p>
  <div id="mount"></div>

<script type="module">
  import { run } from './tests/requirements.js';
  const res = await run(document.getElementById('mount'));
  document.title = `${res.fail ? '✗' : '✓'} ${res.pass}/${res.pass + res.fail + res.skip} — Mosaic Review checks`;
  window.__RESULTS__ = res;
</script>
</body>
</html>
