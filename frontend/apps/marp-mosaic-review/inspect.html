<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARP Source Video</title>
<link rel="icon" href="../../shared/assets/images/marp-mark-favicon.png">
<link rel="stylesheet" href="../../shared/assets/css/tokens.css">
<link rel="stylesheet" href="./styles/inspect.css">
<!-- The player, installed from its release; see shared/vendor/marp-video-player. -->
<script src="../../shared/vendor/marp-video-player/dist/marp-video-player.standalone.js"></script>
</head>
<body>
<!-- No band above the video (#367): its parts are moved into the player's controls and the
     observation panel when the page starts, and this header stays hidden. -->
<header class="inspect-head" hidden>
  <strong id="inspectTitle">Source video</strong>
  <span id="inspectDetail" class="inspect-detail"></span>
  <!-- When the recording started, or that it has none (#76). -->
  <span id="clockState" class="inspect-clock"></span>
  <!-- The clock time of the frame on screen, to compare with the time in the picture (#351). -->
  <span id="clockNow" class="inspect-clock-now"></span>
  <button id="setClock" class="inspect-clock-button" type="button" hidden>Set clock</button>
  <form id="clockForm" class="inspect-clock-form" hidden>
    <span id="clockAt"></span>
    <label>the clock in the picture reads
      <input id="clockReading" name="reading" type="datetime-local" step="0.001" required></label>
    <span>UTC</span>
    <button type="submit">Set</button>
    <button id="clockCancel" type="button">Cancel</button>
  </form>
</header>
<main class="inspect-stage">
  <div id="player" class="inspect-player"></div>
  <canvas id="boxes" class="inspect-boxes" aria-hidden="true"></canvas>
  <!-- The habitats the picture is in, as the annotation GUI lists them over it (#358). -->
  <div id="habitatNow" class="habitat-now" aria-label="Habitats now" hidden></div>
  <!-- The annotation GUI's right-click menu for a box: a long press on a phone. -->
  <div id="boxMenu" class="inspect-menu" role="menu" hidden></div>
  <!-- A box just drawn asks for its species here, and a rename picks one (#181 R1, R3). -->
  <div id="addPopup" class="annotate-popup" role="dialog" aria-label="Species" hidden></div>
  <!-- The selected box's observation (#181 R7). -->
  <aside id="obsPanel" class="annotate-panel" aria-label="Observation" hidden></aside>
  <p id="inspectStatus" class="inspect-status" role="status"></p>
  <form id="signIn" class="inspect-signin" hidden>
    <p>Sign in to the video server with your own Jellyfin account.</p>
    <label>User <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p id="signInError" class="inspect-error" role="alert"></p>
  </form>
</main>
<!-- A habitat session's stretches along the whole video, as the annotation GUI shows them (#287). -->
<section id="habitatStrip" class="hstrip" aria-label="Habitat timeline" hidden></section>
<script type="module" src="./src/inspector/main.js"></script>
</body>
</html>
