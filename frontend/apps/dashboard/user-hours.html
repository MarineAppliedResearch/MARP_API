<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard Report</title>
    <link rel="stylesheet" href="/shared/assets/css/shell.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div data-include="/shared/partials/header.html"></div>
    <div class="container">
        <header class="text-center py-4">
            <img src="https://maregroup.org//wp-content/uploads/2020/04/mare-logo-nobackground-2.gif" alt="Dashboard Logo" class="img-fluid mb-3">
            <h1 class="display-5">User Hours Report</h1>
            <p class="lead">Hours spent per project, per user, per month</p>
            <p class="text-muted">Use the date selectors below to view user observations within a specified time range.</p>
        </header>

        <!-- Date Range Inputs -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-4 col-sm-6 mb-3">
                <label for="startDate" class="form-label">Start Date:</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col-md-4 col-sm-6 mb-3">
                <label for="endDate" class="form-label">End Date:</label>
                <input type="date" id="endDate" class="form-control">
            </div>
            <div class="col-md-2 text-center">
                <button id="fetchDataButton" class="btn btn-primary mt-4">Fetch Data</button>
            </div>
        </div>

        <div class="mb-4">
            <!-- Table for monthly summary -->
            <h3>Monthly Summary Per Project</h3>
            <table id="monthlySummaryTable" class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Project</th>
                        <th>Month</th>
                        <th>Total Hours</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <script>
            // Function to fetch data from the API and generate the table
            async function getData(startDate, endDate) {
                try {
                    const response = await fetch(`/api/getProjectTimeByDateAndUser?start=${startDate}&end=${endDate}`);
                    const responseData = await response.json();
                    generateTables(responseData);
                } catch (error) {
                    console.error('Error fetching dashboard data:', error);
                }
            }

            // Event listener for the Fetch Data button
            document.getElementById('fetchDataButton').addEventListener('click', () => {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;

                if (startDate && endDate) {
                    getData(startDate, endDate);
                } else {
                    alert('Please select both a start and end date.');
                }
            });

            // Helper function to format month from YYYY-MM to "Month YYYY"
            function formatMonth(yearMonth) {
                const [year, month] = yearMonth.split('-');
                const date = new Date(year, month - 1); // month is 0-indexed in JS
                const options = { year: 'numeric', month: 'long' };
                return date.toLocaleDateString(undefined, options);
            }

            // Function to generate tables and group by project and month
            function generateTables(data) {
                const monthlySummaryTable = document.getElementById('monthlySummaryTable').querySelector('tbody');
                monthlySummaryTable.innerHTML = ''; // Clear previous data

                const projectSummaries = {}; // To store project total summaries
                let projectIndex = 0;

                // Iterate over the data and group by project and month
                Object.keys(data).forEach(projectName => {
                    projectIndex++;
                    let projectTotalMinutes = 0;

                    // Create collapsible container for each project
                    const projectRow = document.createElement('tr');
                    projectRow.classList.add('bg-info', 'text-white');
                    projectRow.innerHTML = `
                        <td colspan="3">
                            <button class="btn btn-link text-white" type="button" data-bs-toggle="collapse" data-bs-target="#project-${projectIndex}" aria-expanded="true" aria-controls="project-${projectIndex}">
                                ${projectName}
                            </button>
                        </td>
                    `;
                    monthlySummaryTable.appendChild(projectRow);

                    const collapsibleRow = document.createElement('tr');
                    const collapsibleTd = document.createElement('td');
                    collapsibleTd.setAttribute('colspan', '3');
                    collapsibleTd.innerHTML = `
                        <div id="project-${projectIndex}" class="collapse show">
                            <table class="table mb-0">
                                <thead>
                                    <tr>
                                        <th>Month</th>
                                        <th>Total Hours</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    `;
                    collapsibleRow.appendChild(collapsibleTd);
                    monthlySummaryTable.appendChild(collapsibleRow);

                    const monthTableBody = collapsibleTd.querySelector('tbody');
                    const monthTotals = {}; // Store totals for each month for this project

                    // Iterate over each day (not month) for this project
                    Object.keys(data[projectName]).forEach(day => {
                        const dailyData = data[projectName][day];

                        // Sum the total minutes worked for that day by summing all the values in the object
                        const dailyMinutes = Object.values(dailyData).reduce((a, b) => a + b, 0);

                        // Extract the month (YYYY-MM) from the day (YYYY-MM-DD)
                        const month = day.slice(0, 7);

                        // Sum the total minutes for this day into the respective month
                        if (!monthTotals[month]) {
                            monthTotals[month] = dailyMinutes;
                        } else {
                            monthTotals[month] += dailyMinutes;
                        }

                        projectTotalMinutes += dailyMinutes; // Add to project total
                    });

                    // Now we display the grouped data for this project
                    Object.keys(monthTotals).forEach(month => {
                        const monthRow = document.createElement('tr');
                        monthRow.innerHTML = `
                            <td>${formatMonth(month)}</td>
                            <td>${(monthTotals[month] / 60).toFixed(2)} hrs</td>
                        `;
                        monthTableBody.appendChild(monthRow);
                    });

                    // Add a summary row for the project inside the collapse
                    const projectSummaryRow = document.createElement('tr');
                    projectSummaryRow.classList.add('table-info');
                    projectSummaryRow.innerHTML = `
                        <td>Total hours for ${projectName}</td>
                        <td>${(projectTotalMinutes / 60).toFixed(2)} hrs</td>
                    `;
                    monthTableBody.appendChild(projectSummaryRow);

                    // Store the project total minutes for later grand total
                    projectSummaries[projectName] = projectTotalMinutes;
                });

                // Add a grand total summary row for all projects combined
                const grandTotalMinutes = Object.values(projectSummaries).reduce((a, b) => a + b, 0);
                const grandTotalRow = document.createElement('tr');
                grandTotalRow.classList.add('table-success');
                grandTotalRow.innerHTML = `
                    <td colspan="2">Grand Total Hours (All Projects)</td>
                    <td>${(grandTotalMinutes / 60).toFixed(2)} hrs</td>
                `;
                monthlySummaryTable.appendChild(grandTotalRow);
            }

            // Generate tables after the page is loaded
            window.onload = function () {
                const startDate = new Date();
                const today = new Date();
                const endDate = new Date();
                endDate.setDate(today.getDate() + 1);
                startDate.setDate(startDate.getDate() - 30); // One month ago
                document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
                document.getElementById('endDate').value = endDate.toISOString().split('T')[0];

                // Fetch initial data
                getData(startDate.toISOString().split('T')[0], endDate.toISOString().split('T')[0]);
            };
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/shared/assets/js/partials.js"></script>
    </div>
    <div data-include="/shared/partials/footer.html"></div>
</body>

</html>
