<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARP ML &mdash; Jobs</title>
<link rel="icon" href="../../shared/assets/images/marp-mark-favicon.png">
<link rel="stylesheet" href="../../shared/assets/css/tokens.css">
<link rel="stylesheet" href="../../shared/assets/css/account-menu.css">
<link rel="stylesheet" href="./mock.css">
<script src="../../shared/assets/js/account-menu.js" defer></script>
</head>
<body data-screen="jobs">

<div class="app">

  <aside class="rail"></aside>

  <div class="main">

    <header class="topbar">
      <div class="heading">
        <h1 title="One queue for inference, training and dataset builds, newest first">Jobs</h1>
      </div>
    </header>

    <main class="content">

      <div class="stats jobs-stats" aria-label="Prioritize jobs by status">
        <button class="stat stat-sort" type="button" data-state="running" data-job-priority="running" aria-pressed="false">
          <span class="stat-ico"><svg class="ico"><use href="#i-play"/></svg></span>
          <span class="stat-lab">Running jobs</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
        </button>
        <button class="stat stat-sort" type="button" data-state="queued" data-job-priority="queued" aria-pressed="false">
          <span class="stat-ico"><svg class="ico"><use href="#i-queue"/></svg></span>
          <span class="stat-lab">Queued jobs</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
        </button>
        <button class="stat stat-sort" type="button" data-state="done" data-job-priority="done" aria-pressed="false">
          <span class="stat-ico"><svg class="ico"><use href="#i-tick"/></svg></span>
          <span class="stat-lab">Completed today</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
        </button>
        <button class="stat stat-sort" type="button" data-state="failed" data-job-priority="attention" aria-pressed="false">
          <span class="stat-ico"><svg class="ico"><use href="#i-alert"/></svg></span>
          <span class="stat-lab">Needs attention</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
        </button>
      </div>

      <section class="jobs-overview" aria-label="Jobs at a glance">
        <article class="panel jobs-mix">
          <header class="panel-hd"><div><h2>Job status</h2><p>Current queue and today&rsquo;s outcomes</p></div></header>
          <div class="panel-bd jobs-mix-bd">
            <div class="job-donut" data-rendered role="img" aria-label="Status breakdown">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="donut-track" cx="60" cy="60" r="43"/>
                <circle class="donut-part inference" cx="60" cy="60" r="43" pathLength="45" stroke-dasharray="4 41" stroke-dashoffset="0"/>
                <circle class="donut-part training" cx="60" cy="60" r="43" pathLength="45" stroke-dasharray="2 43" stroke-dashoffset="-4"/>
                <circle class="donut-part queued" cx="60" cy="60" r="43" pathLength="45" stroke-dasharray="11 34" stroke-dashoffset="-8"/>
                <circle class="donut-part done" cx="60" cy="60" r="43" pathLength="45" stroke-dasharray="18 27" stroke-dashoffset="-19"/>
                <circle class="donut-part attention" cx="60" cy="60" r="43" pathLength="45" stroke-dasharray="8 37" stroke-dashoffset="-37"/>
              </svg>
              <span><b></b><small>jobs</small></span>
            </div>
            <div class="job-mix-key"></div>
          </div>
        </article>

        <article class="panel jobs-history" data-jobs-history>
          <header class="panel-hd jobs-history-hd">
            <div><h2>Job activity</h2><p>Starts, completions and queue pressure</p></div>
            <div class="seg" aria-label="Activity range">
              <button type="button" data-jobs-range="24h">24h</button>
              <button type="button" class="on" data-jobs-range="5h">5h</button>
              <button type="button" data-jobs-range="1h">1h</button>
            </div>
          </header>
          <div class="panel-bd jobs-history-bd">
            <div class="jobs-chart" role="img" aria-label="Job activity">
              <svg viewBox="0 0 760 230" aria-hidden="true">
                <g class="jobs-grid"><line x1="42" y1="24" x2="742" y2="24"/><line x1="42" y1="82" x2="742" y2="82"/><line x1="42" y1="140" x2="742" y2="140"/><line x1="42" y1="198" x2="742" y2="198"/></g>
                <g class="jobs-axis"><text x="34" y="28" data-jobs-axis></text><text x="34" y="86" data-jobs-axis></text><text x="34" y="144" data-jobs-axis></text><text x="34" y="202" data-jobs-axis></text><text x="42" y="220" data-jobs-time></text><text x="392" y="220" data-jobs-time></text><text x="742" y="220" data-jobs-time></text></g>
                <path class="jobs-line started" data-jobs-line="started"/><path class="jobs-line completed" data-jobs-line="completed"/><path class="jobs-line queued" data-jobs-line="queued"/>
              </svg>
            </div>
            <div class="jobs-chart-key"><span class="started">Started</span><span class="completed">Completed</span><span class="queued">Queued</span><span class="live"><i class="dot"></i>Design preview</span></div>
          </div>
        </article>
      </section>

      <section class="panel">
        <header class="panel-hd">
          <h2>Jobs <span class="count"></span></h2>
          <div class="panel-tools" id="filters">
            <span class="search">
              <svg class="ico sm"><use href="#i-search"/></svg>
              <input class="inp" type="search" placeholder="Search jobs&hellip;" aria-label="Search jobs">
            </span>
            <select class="sel" aria-label="Job type"><option>All job types</option><option>Inference</option><option>Tracking</option><option>Training</option><option>Diagnostic</option></select>
            <select class="sel" aria-label="Status"><option>All statuses</option><option>Running</option><option>Queued</option><option>Done</option><option>Issues</option><option>Failed</option><option>Cancelled</option><option>Expired</option></select>
            <select data-choices class="sel" aria-label="Window"><option>Last 7 days</option><option>Last 24 hours</option><option>Last 30 days</option></select>
            <button class="btn" type="button" id="expandAll"><svg class="ico"><use href="#i-right"/></svg>Expand all</button>
          </div>
          <div class="jobs-sort-mobile" aria-label="Sort jobs">
            <span>Sort</span>
            <button type="button" data-sort-column="0">Job</button><button type="button" data-sort-column="1">Type</button>
            <button type="button" data-sort-column="2">Scope</button><button type="button" data-sort-column="3">Model / output</button>
            <button type="button" data-sort-column="4">Status</button><button type="button" data-sort-column="5">Progress</button>
            <button type="button" data-sort-column="6">Submitted</button>
          </div>
          <div class="bulk" id="bulk" hidden>
            <span><span class="n" id="bulkN"></span> selected</span>
            <button class="btn sm">Reprioritize</button>
            <button class="btn sm">Retry failed</button>
            <button class="btn sm">Cancel</button>
            <button class="btn sm ghost sp" id="bulkClear">Clear selection</button>
          </div>
        </header>
        <div class="panel-bd flush">
          <div class="tblwrap">
            <table class="tbl fixed stack expandable" id="jobs">
              <thead>
                <tr>
                  <th class="ex"><span class="vh">Expand</span></th>
                  <th class="chk"><input class="chkbox" type="checkbox" id="all" aria-label="Select every job on this page"></th>
                  <th class="hjob sortable">Job</th><th class="htype sortable">Type</th><th class="hscope sortable">Scope</th>
                  <th class="hmodel sortable">Model / output</th><th class="hstatus sortable">Status</th><th class="hprog sortable">Progress</th>
                  <th class="hworker sortable" title="The machine that made the latest attempt">Worker</th><th class="hupd sortable" aria-sort="descending">Submitted</th>
                  <th class="hacts"><span class="vh">Actions</span></th>
                </tr>
              </thead>
              <tbody><!-- Filled from the data layer. A value written here is a value no filter can filter. --></tbody>
            </table>
          </div>
        </div>
        <footer class="panel-ft">
          <span>Counting jobs&hellip;</span>
          <div class="pager" data-rendered>
            <!-- Built by renderJobsHeaderState(). How many pages there are is not a fact
                 this markup can know, and the fixed run of five it used to hold was wrong
                 for every list that was not exactly five pages long. -->
          </div>
          <span class="rpp">Rows
            <select data-choices class="sel" aria-label="Rows per page"><option>18</option><option>25</option><option>50</option></select>
          </span>
        </footer>
      </section>

    </main>
  </div>
</div>



<script src="./api.js"></script>
<script src="./mock.js"></script>

</body>
</html>
