<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — MARP Machine Learning</title>
<link rel="icon" href="../../shared/assets/images/marp-mark-favicon.png">
<link rel="stylesheet" href="../../shared/assets/css/tokens.css">
<link rel="stylesheet" href="../../shared/assets/css/account-menu.css">
<link rel="stylesheet" href="./mock.css">
<script src="../../shared/assets/js/account-menu.js" defer></script>
</head>
<body data-screen="dashboard">

<div class="app">
  <aside class="rail"></aside>

  <div class="main">
    <header class="topbar">
      <div class="heading">
        <h1 title="What is happening across MARP machine learning">Machine Learning Dashboard</h1>
      </div>
    </header>

    <main class="content">
      <nav class="stats dashboard-overview" aria-label="Machine Learning sections">
        <a class="stat stat-link" data-state="running" href="./jobs.html">
          <span class="stat-ico"><svg class="ico"><use href="#i-jobs"/></svg></span>
          <span class="stat-lab">Jobs</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
          <span class="stat-go" aria-hidden="true"><svg class="ico sm"><use href="#i-arrow"/></svg></span>
        </a>

        <a class="stat stat-link" data-state="running" href="./inference.html">
          <span class="stat-ico"><svg class="ico"><use href="#i-inference"/></svg></span>
          <span class="stat-lab">Inference</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
          <span class="stat-go" aria-hidden="true"><svg class="ico sm"><use href="#i-arrow"/></svg></span>
        </a>

        <a class="stat stat-link" data-state="running" href="./training.html">
          <span class="stat-ico"><svg class="ico"><use href="#i-training"/></svg></span>
          <span class="stat-lab">Training</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
          <span class="stat-go" aria-hidden="true"><svg class="ico sm"><use href="#i-arrow"/></svg></span>
        </a>

        <a class="stat stat-link" data-state="queued" href="./datasets.html">
          <span class="stat-ico"><svg class="ico"><use href="#i-datasets"/></svg></span>
          <span class="stat-lab">Datasets</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
          <span class="stat-go" aria-hidden="true"><svg class="ico sm"><use href="#i-arrow"/></svg></span>
        </a>

        <a class="stat stat-link" data-state="done" href="./models.html">
          <span class="stat-ico"><svg class="ico"><use href="#i-models"/></svg></span>
          <span class="stat-lab">Models</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
          <span class="stat-go" aria-hidden="true"><svg class="ico sm"><use href="#i-arrow"/></svg></span>
        </a>

        <a class="stat stat-link" data-state="done" href="./history.html">
          <span class="stat-ico"><svg class="ico"><use href="#i-history"/></svg></span>
          <span class="stat-lab">History</span>
          <b class="stat-num"></b>
          <span class="stat-sub"></span>
          <span class="stat-go" aria-hidden="true"><svg class="ico sm"><use href="#i-arrow"/></svg></span>
        </a>
      </nav>

      <div class="dashboard-panels">
        <section class="panel" id="worker-pool">
          <header class="panel-hd">
            <h2 title="Paused machines stay reachable and take no new work. A worker counts as quiet only after 90 seconds, because an idle machine on a long poll can legitimately go a minute without speaking.">Worker pool</h2>
            <a class="more" href="./workers.html">All workers <svg class="ico sm"><use href="#i-arrow"/></svg></a>
          </header>
          <div class="panel-bd worker-pool-bd">
            <div class="pool">
              <div class="donut" data-rendered>
                <svg viewBox="0 0 132 132" aria-hidden="true">
                  <circle cx="66" cy="66" r="54" fill="none" stroke="rgba(1,6,14,.6)" stroke-width="16"/>
                  <circle cx="66" cy="66" r="54" fill="none" stroke="var(--cyan-400)" stroke-width="16" stroke-linecap="butt" stroke-dasharray="231 108" stroke-dashoffset="0"/>
                  <circle cx="66" cy="66" r="54" fill="none" stroke="var(--blue-400)" stroke-width="16" stroke-linecap="butt" stroke-dasharray="45.5 294" stroke-dashoffset="-232.5"/>
                  <circle cx="66" cy="66" r="54" fill="none" stroke="var(--violet-300)" stroke-width="16" stroke-linecap="butt" stroke-dasharray="12.2 327" stroke-dashoffset="-280"/>
                  <circle cx="66" cy="66" r="54" fill="none" stroke="var(--grey-400)" stroke-width="16" stroke-linecap="butt" stroke-dasharray="43.1 296" stroke-dashoffset="-294.2"/>
                </svg>
                <span class="mid"><b></b><span>Enrolled</span></span>
              </div>
              <div class="legend"></div>
            </div>
            <div class="slots">
              <span class="big">
                <span class="c"><svg class="ico"><use href="#i-slots"/></svg></span>
                <span><span class="n"></span><br><span class="faint slots-label">GPU slots</span></span>
              </span>
              <span class="row"><span class="k">In use</span><span class="v" data-pool-used-summary></span><span class="p" data-pool-used-summary-percent></span></span>
              <span class="row"><span class="k">Available</span><span class="v" data-pool-available></span><span class="p" data-pool-available-percent></span></span>
            </div>
            <section class="pool-history" data-pool-history aria-labelledby="pool-history-title">
              <div class="pool-history-hd">
                <div>
                  <h3 id="pool-history-title">GPU pool utilization</h3>
                  <span class="pool-history-now"><span data-pool-slots-total></span> total slots <i><span class="dot" data-state="running"></span> Live</i></span>
                </div>
                <div class="seg pool-ranges" role="group" aria-label="GPU utilization time range">
                  <button type="button" data-pool-range="1h" aria-pressed="false">1h</button>
                  <button type="button" class="on" data-pool-range="24h" aria-pressed="true">24h</button>
                  <button type="button" data-pool-range="7d" aria-pressed="false">7d</button>
                  <button type="button" data-pool-range="30d" aria-pressed="false">30d</button>
                </div>
              </div>
              <div class="pool-chart" role="img" aria-label="GPU compute, memory, workload and active GPU history over the last 5 hours, updating preview">
                <div class="pool-chart-key" aria-label="Chart series and current values">
                  <button type="button" class="compute-used" data-pool-highlight="computeUsed" aria-pressed="false">Compute <b data-current="computeUsed">41% used</b> · <b class="free" data-current="computeAvailable">59% free</b></button>
                  <button type="button" class="training" data-pool-highlight="training" aria-pressed="false">Training <b data-current="training">26%</b></button>
                  <button type="button" class="inference" data-pool-highlight="inference" aria-pressed="false">Inference <b data-current="inference">15%</b></button>
                  <button type="button" class="vram-used" data-pool-highlight="vramUsed" aria-pressed="false">VRAM <b data-current="vramUsed">45% used</b> · <b class="free" data-current="vramAvailable">55% free</b></button>
                  <button type="button" class="queue-training" data-pool-highlight="queueTraining" aria-pressed="false">Training queue <b data-current="queueTraining">2</b></button>
                  <button type="button" class="queue-inference" data-pool-highlight="queueInference" aria-pressed="false">Inference queue <b data-current="queueInference">6</b></button>
                  <span class="top-load">Top load <b>MARP Multiclass Det XL · 14%</b></span>
                </div>
                <svg viewBox="0 0 760 260" aria-hidden="true">
                  <g class="pool-grid">
                    <line x1="44" y1="24" x2="744" y2="24"/>
                    <line x1="44" y1="118" x2="744" y2="118"/>
                    <line x1="44" y1="212" x2="744" y2="212"/>
                  </g>
                  <g class="pool-axis">
                    <text x="36" y="28"></text>
                    <text x="36" y="122"></text>
                    <text x="36" y="216"></text>
                    <text class="axis-title" x="44" y="13">POOL CAPACITY</text>
                    <text class="right" x="752" y="28"></text>
                    <text class="right" x="752" y="122"></text>
                    <text class="right" x="752" y="216"></text>
                    <text class="axis-title right" x="744" y="13">QUEUED JOBS</text>
                    <text class="pool-time" data-pool-time="start" x="44" y="245"></text>
                    <text class="pool-time" data-pool-time="middle" x="394" y="245"></text>
                    <text class="pool-time end" data-pool-time="end" x="744" y="245"></text>
                  </g>
                  <path class="pool-area inference" data-pool-area="inference"/>
                  <path class="pool-area training" data-pool-area="training"/>
                  <path class="pool-line compute-used" data-pool-line="computeUsed"/>
                  <path class="pool-line vram-used" data-pool-line="vramUsed"/>
                  <path class="pool-line queue-training" data-pool-line="queueTraining"/>
                  <path class="pool-line queue-inference" data-pool-line="queueInference"/>
                </svg>
              </div>
            </section>
          </div>
        </section>

        <section class="panel" id="current-activity">
          <header class="panel-hd">
            <h2>Current and recent jobs <span class="count"></span></h2>
            <a class="more" href="./jobs.html">All jobs <svg class="ico sm"><use href="#i-arrow"/></svg></a>
          </header>
          <div class="panel-bd flush">
            <div class="activity-sort" aria-label="Sort current and recent jobs">
              <span>Sort</span>
              <button type="button" data-sort-column="0">Job</button>
              <button type="button" data-sort-column="1">Type</button>
              <button type="button" data-sort-column="2">Status</button>
              <button type="button" data-sort-column="3">Progress</button>
              <button type="button" data-sort-column="4">Updated</button>
            </div>
            <div class="tblwrap">
              <table class="tbl activity-table">
                <thead>
                  <tr>
                    <th class="sortable" aria-sort="ascending">Job</th>
                    <th class="sortable">Type</th>
                    <th class="sortable">Status</th>
                    <th class="sortable num">Progress</th>
                    <th class="sortable">Updated</th>
                  </tr>
                </thead>
                <tbody><!-- Filled from the data layer. A value written here is a value no filter can filter. --></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="./api.js"></script>
<script src="./mock.js"></script>
</body>
</html>
